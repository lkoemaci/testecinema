<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Direção de arte: revista independente de cinema. Grid editorial, serifa expressiva nos títulos, sans nos textos e números. */
:root{--bg:#f2ece0;--fg:#1c1b19;--mut:#655f55;--card:#f8f3e8;--line:#cfc4aa;--acc:#b0502f;--acc2:#4f6173;--gold:#8f6d22;--sand:#e6dcc5;--bar:#ddd2ba;

--serif:"Fraunces","Iowan Old Style","Palatino Linotype",Georgia,serif;--sans:"Instrument Sans","Helvetica Neue",Arial,system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141311;--fg:#ece5d6;--mut:#a39b8c;--card:#1c1b18;--line:#38352e;--acc:#e0805e;--acc2:#93a7ba;--gold:#c9a24f;--sand:#24221e;--bar:#2d2a25;--hbg:#0e0d0c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141311;--fg:#ece5d6;--mut:#a39b8c;--card:#1c1b18;--line:#38352e;--acc:#e0805e;--acc2:#93a7ba;--gold:#c9a24f;--sand:#24221e;--bar:#2d2a25;--hbg:#0e0d0c;color-scheme:dark}
*,*:before,*:after{box-sizing:inherit}
html,body{height:auto}body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}

button.p:hover,.cta:hover{background:var(--acc);border-color:var(--acc);color:#fff}button.s{width:auto;border-color:var(--line);color:var(--mut)}button.s:hover{border-color:var(--fg);background:transparent;color:var(--fg)}

.cv-k{font:600 .78rem var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin:0}.cv-d{font:400 1.2rem/1.45 var(--sans);max-width:34ch}

.amap{list-style:none;display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:3px;margin:14px 0 6px;padding:0}.amap li{display:flex;flex-direction:column;gap:3px;align-items:stretch}.amap i{display:block;height:3px;background:var(--bar);position:relative;overflow:hidden}.amap i:after{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--w,0%);background:var(--fg)}.amap span{font:500 .6rem var(--sans);text-align:center;color:var(--mut);font-variant-numeric:tabular-nums}.amap .cur i{height:7px;background:var(--bar)}.amap .cur i:after{background:var(--acc)}.amap .cur span{color:var(--acc);font-weight:700}
.pr{height:2px;background:var(--bar);margin:6px 0 clamp(22px,5vw,44px)}.pr i{display:block;height:100%;background:var(--fg)}
.qq{font:500 clamp(1.35rem,3.4vw,1.9rem)/1.28 var(--sans);letter-spacing:-.01em;margin:0 0 clamp(18px,4vw,32px);max-width:30em;font-family:var(--sans);text-wrap:pretty}
.ab{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;border-top:1px solid var(--fg);border-bottom:1px solid var(--fg);margin-bottom:18px}.ab>div{padding:16px 16px 18px 0;font-size:1.05rem}.ab>div+div{padding-left:16px;border-left:1px solid var(--fg)}.ab b{display:block;font:800 2rem/1 var(--serif);color:var(--acc);margin-bottom:6px}.ab>div+div b{color:var(--acc2)}
.opts{display:grid;gap:8px}.opts.lk{grid-template-columns:repeat(5,minmax(0,1fr))}.opts.ch{grid-template-columns:repeat(4,minmax(0,1fr))}

.opts button.ns{grid-column:1/-1;min-height:0;flex-direction:row;border-color:var(--line);color:var(--mut);justify-content:flex-start;padding:10px 12px}
.qf{margin-top:20px}

.rh h2.pn{border:0;padding:0;margin:.35em 0 .2em;font-weight:800;font-size:clamp(2.4rem,7.4vw,4.8rem);line-height:.94;letter-spacing:-.035em;font-variation-settings:"opsz" 144;color:var(--hfg)}
.rh .fr{font:italic 400 clamp(1.15rem,2.6vw,1.5rem)/1.3 var(--serif);color:var(--hmut);max-width:26ch}.rh .lab{font-size:.88rem;color:var(--hmut);margin:.9em 0 0}.rh .lab b{color:var(--hfg);font-weight:600}
.rh .shr{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 0}.rh .shr button{background:var(--hgold);border-color:var(--hgold);color:#171513;font-weight:600;text-align:center;flex:1 1 150px}.rh .shr button:hover{background:var(--hfg);border-color:var(--hfg)}
.rh figure{margin:0;align-self:center}.rh figcaption{font-size:.74rem;color:var(--hmut);margin-top:6px;max-width:none}
.radar{width:100%;max-width:560px;display:block;margin:0 auto;font-family:var(--sans);--rl:#4a453c;--rm:#b8ae9a;--rf:#efe8d8;--hs:#9db0c2;--ht:#e0805e;--hg:#d1aa55;--hb:#171513}
.art{columns:2 300px;column-gap:44px;column-rule:1px solid var(--line)}.art p{margin:0 0 .8em;max-width:none;font-size:1.04rem}.art p:first-child:first-letter{font:800 4.2em/.78 var(--serif);float:left;padding:.07em .09em 0 0;color:var(--acc)}
.t3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:32px}.t3i{border-top:1px solid var(--fg);padding:12px 0 18px}.t3i .rn{font:italic 500 1.1rem var(--serif);color:var(--mut)}.t3i .n{font:600 clamp(3.4rem,7vw,5.2rem)/1 var(--sans);letter-spacing:-.05em;font-variant-numeric:tabular-nums;margin:6px 0 4px;color:var(--acc)}.t3i .n.s2{color:var(--acc2)}.t3i .n small{font-size:.38em;letter-spacing:0;margin-left:2px}.t3i h3{margin:0 0 4px}.t3i p{font-size:.95rem}
.eq{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(16px,4vw,48px);border-top:1px solid var(--fg);padding-top:16px}.eq h3{font:italic 500 clamp(1.5rem,3.4vw,2.2rem)/1.1 var(--serif);margin-bottom:14px}.eq p{margin-top:0}
.sc{position:relative;height:22px;margin:6px 0;background:linear-gradient(var(--line),var(--line)) 0 50%/100% 1px no-repeat,linear-gradient(var(--fg),var(--fg)) 50% 50%/1px 14px no-repeat,linear-gradient(var(--line),var(--line)) 15% 50%/1px 8px no-repeat,linear-gradient(var(--line),var(--line)) 35% 50%/1px 8px no-repeat,linear-gradient(var(--line),var(--line)) 65% 50%/1px 8px no-repeat,linear-gradient(var(--line),var(--line)) 85% 50%/1px 8px no-repeat}
.sc .f{position:absolute;top:calc(50% - 1.5px);height:3px;display:block}.sc .f.s1,.sc .m.s1{background:var(--acc)}.sc .f.s2,.sc .m.s2{background:var(--acc2)}.sc .m{position:absolute;top:50%;width:12px;height:12px;transform:translate(-50%,-50%) rotate(45deg)}
.axs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:48px}.axr{display:grid;grid-template-columns:2.1rem minmax(0,1fr);gap:0 10px;border-top:1px solid var(--line);padding:16px 0 12px}.axn{font:600 .85rem var(--sans);color:var(--acc);font-variant-numeric:tabular-nums;padding-top:.15em}
.pl{display:flex;justify-content:space-between;gap:12px;font-size:.84rem;color:var(--mut)}.pl .on{color:var(--fg);font-weight:700}.pl span:last-child{text-align:right}
.meta{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;font-size:.84rem}.meta .pc{margin-left:auto;font:600 1.15rem var(--sans);color:var(--fg);font-variant-numeric:tabular-nums}.axr p{margin:.35em 0;font-size:.92rem}.axr details summary{cursor:pointer;color:var(--mut);font-size:.84rem}.axr details p{max-width:none}
.chip{display:inline-block;font:600 .68rem var(--sans);letter-spacing:.04em;text-transform:uppercase;padding:1px 8px;border:1px solid var(--mut);color:var(--mut)}.chip.forte{background:var(--fg);color:var(--bg);border-color:var(--fg)}.chip.moderada{border-color:var(--fg);color:var(--fg)}
.row2{display:none}
#shm{position:fixed;inset:0;background:rgba(14,13,12,.88);z-index:50;display:flex;align-items:center;justify-content:center;padding:12px;overflow:auto}
.shb{position:relative;background:var(--bg);color:var(--fg);padding:14px;max-width:480px;width:100%;max-height:96vh;overflow:auto}.shb img{width:100%;display:block;margin-bottom:10px}.shb .x{position:absolute;right:8px;top:8px;width:38px;height:38px;padding:0;text-align:center;background:var(--bg)}
.shr2{display:flex;flex-wrap:wrap;gap:8px}.shr2 button{flex:1 1 120px;text-align:center}
.shr{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.shr button{text-align:center;flex:1 1 170px}
@media(max-width:820px){.cover,.rh,.eq{grid-template-columns:minmax(0,1fr)}.cv-art{order:3}.t3,.axs,.toc ol{grid-template-columns:minmax(0,1fr)}.opts.lk{grid-template-columns:minmax(0,1fr)}.opts.lk button{flex-direction:row;align-items:center;text-align:left;justify-content:flex-start;min-height:56px;gap:12px}.opts.lk button i{order:-1;min-width:1.2em}.opts.ch{grid-template-columns:repeat(2,minmax(0,1fr))}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}.facts div{padding-bottom:10px}.qk{max-width:40%}.axs{column-gap:0}.t3i{border-top:1px solid var(--fg)}}
@media(max-width:520px){.rh{padding:18px 12px}.opts button span{text-align:left}.ab{grid-template-columns:minmax(0,1fr)}.ab>div+div{padding-left:0;border-left:0;border-top:1px solid var(--fg)}.amap span{font-size:.5rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.chr,.dif{margin:1.4em 0}.chr h3,.dif h3{font:600 .8rem var(--sans);letter-spacing:.04em;margin:0 0 .6em;color:var(--mut)}.chr ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:.6em 1.6em}.chr li{padding:.55em 0 .55em .9em;border-left:2px solid var(--acc);font:400 .95rem/1.45 var(--sans)}.dif .card p{margin:.4em 0 0;font-size:.92rem;line-height:1.5}.dif>p{font:400 .95rem/1.5 var(--sans)}@media(max-width:620px){.chr ul{grid-template-columns:1fr}}
</style></head><body><main id="app"></main>
<script>
const AX=[["Registro do real","Construção da imagem"],["Transparência","Reflexividade"],["Sentido claro","Sentido aberto"],["Narrativa clássica","Narrativa fragmentada ou poética"],["Ritmo contemplativo","Ritmo acelerado"],["Imersão emocional","Distanciamento reflexivo"],["Visão autoral","Obra coletiva e de estúdio"],["Liberdade formal","Fórmula de gênero"],["Arte exigente","Prazer popular"],["Cinema engajado","Cinema autônomo"],["Cânone","Vozes periféricas e marginais"],["Sala e película","Experiência híbrida e digital"],["Atuação como centro","Atuação a serviço do conjunto"],["Roteiro como centro","Direção como centro"]];
const ADJ=[["Realista","Construtor"],["Imersivo","Reflexivo"],["Direto","Enigmático"],["Clássico","Fragmentário"],["Contemplativo","Acelerado"],["Emotivo","Analítico"],["Autoral","Coletivo"],["Livre","De gênero"],["Exigente","Popular"],["Engajado","Autônomo"],["Canônico","Periférico"],["De sala","Híbrido"],["Do ator","Do conjunto"],["De roteiro","De direção"]];
const T=[
["Fico mais impressionado quando sinto que a câmera capturou algo que de fato aconteceu diante dela.","Gosto quando a direção assume uma estética artificial e construída, sem tentar fazer suas imagens parecerem naturais.","Prefiro quando um filme apresenta pessoas, lugares e situações de maneira próxima à realidade cotidiana, sem embelezá-los ou transformá-los excessivamente.","Prefiro que um filme invente um mundo próprio, com cenários, cores e figurinos que ninguém encontraria na rua","Uma cena em locação real, com luz natural e pessoas comuns, em que tudo parece verdadeiro.|Uma cena totalmente planejada, com cenário, figurino e enquadramento construídos até o último detalhe."],
["Gosto quando tudo acontece de maneira tão natural que nem percebo como o filme está sendo construído.","Gosto de filmes que questionam a própria natureza do cinema, explorando seus limites, possibilidades e formas de representação.","Prefiro que o estilo da direção passe despercebido e deixe a história em primeiro plano.","Gosto quando percebo que a maneira de filmar também faz parte do que o filme quer dizer.","Gosto quando os recursos do cinema ajudam a contar a história sem chamar mais atenção do que ela própria.|Gosto quando os recursos do cinema se destacam e também se tornam parte daquilo que o filme quer expressar."],
["Entendo melhor um filme quando os personagens explicam o que sentem e por que agem como agem.","Gosto quando um filme guarda algo sem explicação explícita, como uma imagem, um gesto ou um silêncio que fica na cabeça.","Um final fechado, que responde às grandes perguntas da história.|Um final aberto, que me deixa decidir o que de fato aconteceu."],
["Prefiro filmes que valorizam atmosferas, imagens e sensações, mesmo quando isso significa abrir mão de uma narrativa tradicionalmente estruturada.","Prefiro filmes cuja história dá para resumir em poucas frases, com começo, meio e fim bem definidos.","Prefiro que os acontecimentos importantes de um filme se liguem por causa e efeito, e não por associação de imagens.","Gosto quando um filme pula no tempo e mistura memórias, sonhos e realidade, mesmo sem explicar tudo.","Uma história linear que avança sem rodeios até o final.|Um mosaico de cenas e imagens que formam um sentimento, e não exatamente uma trama."],
["Gosto de planos longos em que quase nada acontece e eu apenas observo.","Prefiro filmes que não me dão tempo para respirar, com ritmo rápido e muitos cortes.","Valorizo filmes que dedicam atenção a atividades e momentos cotidianos, mesmo quando eles não possuem uma função narrativa evidente.","Prefiro filmes que mantêm um nível elevado de energia ao longo de sua duração.","Um filme que encontra interesse nos momentos de silêncio, espera e tranquilidade, mesmo quando pouca coisa acontece.|Um filme que mantém um fluxo constante de acontecimentos, conflitos e situações que exigem a atenção do espectador."],
["Para mim, é importante que um filme ultrapasse o interesse narrativo e me provoque uma experiência emocional.","Prefiro que um filme me faça pensar do que me faça sentir.","Um filme que não me emociona, por mais inteligente que seja, perde a graça para mim.","Um filme que me faz pensar e discutir depois vale mais para mim do que um que só me faz chorar ou rir.","Prefiro filmes cuja experiência me afeta emocionalmente, mesmo quando não consigo explicar exatamente por quê.|Prefiro filmes que me deixam pensando sobre seus símbolos, mensagens e possíveis interpretações."],
["Costumo escolher filmes pelo nome do diretor.","Acho exagerado tratar um filme como obra de uma só pessoa: ele é feito por muita gente.","Gosto de reconhecer o estilo pessoal de um diretor em filmes diferentes dele.","Não me importa quem dirigiu um filme, se ele é bem feito.","Um filme com a marca inconfundível de um único diretor.|Um filme em que produção, elenco e equipe técnica formam um conjunto bem ajustado."],
["Prefiro filmes que quebram as regras de qualquer gênero.","Gosto de saber o que esperar de um gênero e ver bem executados os elementos de sempre.","Fico entediado quando consigo prever o que vai acontecer no filme.","Um filme de gênero bem executado me satisfaz mais do que um que tenta fugir das regras.","Um filme que não se encaixa em nenhum gênero.|Um filme que cumpre à risca as regras de um gênero que eu amo."],
["Prefiro filmes que priorizam a expressão artística, mesmo que se afastem do que o público costuma esperar.","Acho que o cinema deve ser, antes de tudo, uma forma de entretenimento.","Assistir a um filme exige postura ativa do espectador; a obra não tem a obrigação de facilitar o entendimento de quem assiste.","Quando um filme agrada a muita gente, isso pesa a favor dele para mim.","Um filme que exige atenção à composição, à montagem, aos símbolos e às escolhas formais para ser plenamente apreciado.|Um filme que prioriza o envolvimento do público e proporciona uma experiência de entretenimento satisfatória."],
["Priorizo filmes que tomam posição sobre problemas sociais ou políticos.","Prefiro um filme sem mensagem alguma a um que tente me convencer de alguma coisa.","Para mim, o cinema tem responsabilidade com a sociedade.","Prefiro que o filme trate de experiências humanas e de forma, sem mensagem política.","Um filme que denuncia e provoca discussão pública.|Um filme que vale por si mesmo, sem pretender mudar nada."],
["Acho importante ver os grandes clássicos reconhecidos antes de explorar outros filmes.","Procuro filmes de países, regiões ou grupos que raramente aparecem nas listas de melhores filmes.","Listas de melhores filmes de todos os tempos são um bom guia para mim.","Gosto de filmes feitos fora dos grandes centros, com poucos recursos e vozes locais.","Um clássico celebrado que todo cinéfilo viu.|Um filme pouco conhecido de uma cinematografia que quase ninguém comenta."],
["Ver um filme numa sala escura, sem pausa nem distração, é uma experiência que não se repete em casa.","Para mim vale ver filmes em casa, no celular ou em streaming, sem sentir que perdi algo.","A película, com seus grãos e texturas, tem algo que o digital não tem.","Gosto do cinema misturado a outras mídias, como séries, vídeos curtos e jogos.","Ver na sala de cinema, em película se possível.|Ver no conforto de casa, quando eu quiser."],

const EXP=["Mede se você enxerga o cinema como uma janela para a realidade ou como uma linguagem capaz de reconstruí-la. Perto do primeiro polo, você valoriza a observação do mundo, a continuidade dos acontecimentos, a profundidade de campo e a ambiguidade das imagens, na linha de André Bazin. Perto do segundo, você valoriza a montagem, a composição visual, a encenação e a manipulação das imagens como instrumentos de criação de sentido, como em Sergei Eisenstein.", "Mede sua preferência entre a transparência narrativa, que busca ocultar os mecanismos de construção cinematográfica para preservar a imersão na história, e a reflexividade, que evidencia o próprio ato de fazer cinema e os dispositivos que constituem a linguagem audiovisual. Perto do primeiro polo, você valoriza a continuidade narrativa, a invisibilidade da montagem e uma encenação que não chama atenção para si mesma. Perto do segundo, aprecia filmes que expõem sua artificialidade, rompem a ilusão ficcional, exploram a metalinguagem, quebram a quarta parede e tornam a linguagem cinematográfica parte do próprio discurso.", "Mede o quanto você precisa que o filme se explique. Perto do primeiro polo, você gosta de finais que fecham a história. Perto do segundo, você gosta de interpretações múltiplas e de sair da sala com perguntas.", "Mede a sua relação com a estrutura da história. Perto do primeiro polo, a causa e o efeito conduzem o enredo. Perto do segundo, o filme pode funcionar por clima, imagem, memória e associação, mais do que por trama.", "Mede o tempo que você gosta de dedicar a cada cena. Perto do primeiro polo, você aprecia planos longos e silêncios. Perto do segundo, você gosta de montagem rápida e de um filme que não para.", "Mede a relação que você estabelece com o filme entre o envolvimento afetivo e a observação crítica. Perto do primeiro polo, você valoriza a imersão emocional, a identificação com os personagens e os recursos narrativos e audiovisuais que favorecem a empatia e a experiência sensorial. Perto do segundo, prefere uma postura mais analítica diante da obra, na qual o distanciamento da ação dramática permite questionar suas representações, refletir sobre seus significados e reconhecer os mecanismos de construção do próprio filme, em uma perspectiva próxima ao teatro épico de Bertolt Brecht.", "Mede onde você identifica a principal força criativa e expressiva de um filme: na visão artística individual do diretor ou na articulação coletiva dos diferentes profissionais envolvidos em sua realização. Perto do primeiro polo, você valoriza a unidade estética, a recorrência de temas e a assinatura formal de um cineasta, reconhecendo o diretor como principal princípio organizador da obra, em uma perspectiva próxima à política dos autores defendida pelos críticos dos Cahiers du Cinéma. Perto do segundo, você valoriza a contribuição integrada de roteiristas, diretores de fotografia, montadores, diretores de arte, compositores e demais colaboradores, compreendendo o filme como resultado de uma criação compartilhada, na qual diferentes sensibilidades e competências moldam sua identidade.", "Mede se você busca a surpresa ou o conforto da convenção. Perto do primeiro polo, você quer filmes que quebram regras. Perto do segundo, você gosta de ver as regras de um gênero bem executadas.", "Mede o quanto você aceita esforço em troca de recompensa a longo prazo, ou prefere prazer imediato e compartilhado. Nenhum lado é melhor que o outro: o cinema popular tem mérito artístico, e o cinema exigente também pode dar prazer.", "Mede se você espera que o cinema tome posição sobre o mundo ou que ele valha por si. Perto do primeiro polo, você valoriza filmes com posição política ou social, como no Cinema Novo e no Terceiro Cinema. Perto do segundo, você valoriza o filme como obra independente de causas.", "Mede o seu mapa de referências. Perto do primeiro polo, você parte dos clássicos reconhecidos. Perto do segundo, você procura filmes feitos fora dos grandes centros $.innerHTML=`<div class="mast"><span>Teste de Cinema</span><span>Um ensaio interativo em 14 eixos</span><span>Edição permanente</span></div><div class="cover"><div><p class="cv-k">Qual é o seu olhar sobre o cinema?</p><h1 class="cv-t">Teste<br>de Cinema</h1><p class="cv-d">Um mapa do seu jeito de ver filmes em 14 dimensões. Não é um julgamento de bom ou mau gosto: cada eixo vai de um polo legítimo a outro.</p><button class="cta" onclick="start()">Começar o teste</button><dl class="facts"><div><dt>78</dt><dd>perguntas, até 93 com os gêneros que você curte</dd></div><div><dt>14</dt><dd>minutos, em média</dd></div><div><dt>14</dt><dd>eixos</dd></div><div><dt>15</dt><dd>perfis</dd></div></dl><p class="how">As 68 primeiras perguntas mapeiam o seu jeito de ver e as 10 seguintes perguntam sobre gêneros. Nos gêneros que você curte podem vir até 15 perguntas de aprofundamento. Em cada pergunta, escolha o que mais combina com você. “Não sei ou não vi” não conta pontos.</p></div><div class="cv-art">${art}</div></div><section class="toc"><h2>Nesta edição</h2><ol>${AX.map((a,i)=>`<li><b>${pad2(i+1)}</b><span>${a[0]} ↔ ${a[1]}</span></li>`).join("")}</ol></section>`}
function start(){ord=Q.slice(0,NA).map((_,i)=>i);for(let i=ord.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[ord[i],ord[j]]=[ord[j],ord[i]]}for(let k=0;k<10;k++)ord.push(NA+k);ix=0;ans={};ask()}

const done=Array(14).fill(0),all=Array(14).fill(0);Q.forEach(x=>{if(x.a>=0)all[x.a]++});ord.slice(0,ix).forEach(i=>{const a=Q[i].a;if(a>=0)done[a]++});

function score(){const pos=[],mix=[];for(let a=0;a<14;a++){let s=0,m=0,p1=false,p2=false;Q.forEach((q,i)=>{if(q.a!=a||ans[i]==null)return;const v=ans[i];s+=(q.c?v:v*q.d)*q.w;m+=2*q.w;if(!q.c&&v==2){q.d<0?p1=true:p2=true}});pos.push(m?50+50*s/m:50);mix.push(p1&&p2)}return{pos,mix}}

const PT=[
["Você valoriza o cinema que parece ter testemunhado o mundo: locações reais, gente comum, o acaso e o tempo da vida contam a favor.","Você se interessa pelo que o cinema fabrica: luz, cenário, enquadramento e figurino pensados como uma imagem construída."],
["Você gosta que a forma sirva à história e quase se faça esquecer, deixando a cena fluir sem chamar atenção para si.","Você gosta quando o filme mostra que é filme: a linguagem aparece, comenta a si mesma e convida a pensar no próprio cinema."],
["Você prefere obras que se deixam compreender, em que o essencial é legível sem exigir decifração.","Você aprecia obras que não fecham o significado e deixam perguntas, ambiguidade e espaço para interpretar."],
["Você se sente em casa em histórias com começo, meio e fim, em que causa e consequência se encadeiam bem.","Você aceita que uma narrativa se organize por fragmentos, associações, imagens ou ritmo poético, sem linha reta."],
["Você dá valor a planos longos, silêncio e tempo para olhar: para você, a lentidão faz parte da experiência.","Você gosta de energia, montagem ágil e progressão rápida, em que o filme não para para respirar."],
["Você quer ser puxado para dentro: envolver-se com os personagens e sentir a história junto com eles.","Você prefere ver com alguma distância, observando e pensando sobre o que vê, em vez de se deixar levar pela emoção."],
["Você enxerga o filme como obra de um olhar pessoal e procura a assinatura de quem dirige.","Você enxerga o cinema como trabalho de equipe e de indústria, em que estúdio, elenco e ofício contam tanto quanto uma assinatura."],
["Você valoriza filmes que inventam a própria forma, sem se prender às convenções de gênero.","Você gosta das convenções de gênero e do prazer de reconhecê-las, vê-las cumpridas ou levemente deslocadas."],
["Você busca obras que pedem esforço, atenção e repertório, e vê nisso parte da recompensa.","Você valoriza o cinema que se compartilha, que diverte e alcança muita gente sem pedir repertório prévio."],
["Você procura filmes que tomam posição sobre o mundo, a sociedade e a política, e que dão ao cinema uma função fora de si.","Você prefere que o filme exista por si, como experiência e forma, sem precisar servir a uma causa."],
["Você se apoia nos clássicos e nas obras consagradas como mapa para entender o cinema.","Você procura vozes e cinematografias fora do centro, marginais, regionais ou pouco consagradas, e desconfia de mapas fechados."],
["Você valoriza a sala escura e a materialidade da película, a experiência vivida como ritual.","Você se sente à vontade com o cinema que circula em telas variadas, no streaming, no digital e em formatos novos."],
["Você vê o rosto, a voz e a presença dos intérpretes como o coração do filme.","Você vê a atuação como uma peça entre outras, a serviço do conjunto da cena, do ritmo e da imagem."],
["Você olha primeiro para o que está escrito: estrutura, diálogos e a construção da história.","Você olha primeiro para como a cena é encenada: câmera, espaço, ritmo e as decisões de direção."]];
const PERF=[
{n:"Espectador Formalista",f:"Para você, a forma é o assunto.",t:"Você assiste a um filme como quem lê uma partitura: o enquadramento, a luz, o corte e o movimento de câmera dizem tanto quanto o enredo, às vezes mais. Quando sente uma mão por trás das imagens, uma escolha que só aquele diretor faria, o filme ganha vida. Você aceita que a forma seja protagonista, mesmo quando ela pede atenção, repertório e uma segunda sessão. Para você, o cinema é, antes de tudo, a arte de decidir onde pôr a câmera e o que mostrar com ela.",c:["Repara na composição do plano antes de reparar no desfecho.", "Valoriza a assinatura de quem dirige e perdoa um enredo magro por uma imagem inesquecível.", "Aceita narrativas fragmentadas e estranhamentos quando a linguagem os justifica.", "Costuma rever filmes para notar o que passou despercebido na primeira vez."],v:[["Investigador de Sentidos", "Os dois gostam de filmes difíceis, mas fazem perguntas diferentes. O Investigador quer saber o que o filme significa; o Formalista quer saber como ele foi feito. Se o seu prazer está na decisão de câmera, e não na resposta, o perfil é este."], ["Contemplativo da Sala Escura", "Ambos aceitam o filme lento. O Contemplativo procura o tempo e a presença do real; o Formalista procura a construção deliberada da imagem, mesmo que ela seja rápida e artificial."]],w:{0:[80,1],1:[68,1],3:[70,1],13:[82,1.5],6:[22,1],7:[25,1],9:[65,.6]},o:3.33},
{n:"Investigador de Sentidos",f:"Um bom filme é uma pergunta que fica.",t:"Você sai do cinema com mais perguntas do que entrou, e gosta disso. Um filme que se explica por inteiro lhe parece encerrado cedo demais: o que atrai você é a ambiguidade bem construída, o detalhe que muda de peso na segunda leitura, o final que obriga a conversar. Você assiste com a cabeça acesa, mantém uma distância crítica e se diverte montando teorias. Para você, entender um filme é uma atividade, não um favor que ele faz ao espectador.",c:["Prefere finais que não se fecham e personagens que não se explicam.", "Assiste com distância crítica, atento a camadas e símbolos.", "Procura o debate depois da sessão: ler, comparar, discordar.", "Tolera, e até aprecia, o desconforto de não ter uma resposta única."],v:[["Espectador Formalista", "O Formalista se encanta com a construção da imagem; o Investigador, com o que ela abre para interpretar. Se a sua primeira pergunta ao sair da sala é “o que isso quer dizer?”, o perfil é este."], ["Contemplativo da Sala Escura", "O Contemplativo mergulha na duração e na presença, sem precisar decifrar nada. O Investigador quer decifrar, mesmo sabendo que talvez nunca chegue a uma resposta final."]],w:{2:[85,1.5],3:[75,1],5:[70,1],1:[68,1],8:[28,.7],13:[60,.5]},o:1.31},
{n:"Contemplativo da Sala Escura",f:"O tempo na tela também é o filme.",t:"Você se entrega ao filme que respira. Planos longos, silêncios, o gesto banal que se estende até virar acontecimento: é nesses intervalos que você sente o cinema trabalhar. Não tem pressa de que a história avance, porque a história, para você, está no tempo que passa diante da câmera. Prefere a sala escura e a atenção inteira, e sai de uma sessão como quem voltou de uma caminhada longa: mais lento, mais atento ao que está em volta.",c:["Aprecia planos longos, pausas e cenas em que “nada” acontece.", "Valoriza a presença do real: lugares, rostos e sons sem enfeite.", "Prefere ver na sala, com atenção total e sem interrupções.", "Aceita que o sentido fique em aberto, como depois de uma boa pausa."],v:[["Espectador Formalista", "O Formalista admira a construção e a assinatura de quem dirige. O Contemplativo procura a duração e o real, e pode adorar um filme que não exibe nenhum estilo."], ["Cronista do Real", "Os dois valorizam o real. O Cronista quer que o filme tome posição e que a mensagem chegue; o Contemplativo prefere que o filme observe e deixe o sentido em aberto."]],w:{4:[12,1.5],11:[22,1],0:[28,1],2:[68,.8],8:[30,.7]},o:1},
{n:"Cronista do Real",f:"A câmera como testemunha do mundo.",t:"Para você, o cinema é um modo de olhar a vida real e de dar a ela um lugar na tela. Você se comove com o que soa verdadeiro: o rosto de quem raramente é filmado, a rua como ela é, a história que nasce de uma situação concreta. Gosta quando o filme sabe o que quer dizer e se importa com o que acontece fora da sala. Um bom filme, para você, é uma forma de testemunho, e a sessão só termina quando você sai com algo para pensar.",c:["Confia mais no que parece observado do que no que parece fabricado.", "Valoriza filmes com posição clara sobre desigualdade, memória e cotidiano.", "Dá peso a atuações naturais e a roteiros bem escritos.", "Prefere histórias contadas de forma direta e acessível."],v:[["Cinéfilo Político-Autoral", "Os dois se importam com o mundo. O Político-Autoral procura um diretor com voz e linguagem próprias; o Cronista prefere o registro direto do real e uma forma que não se interponha."], ["Contemplativo da Sala Escura", "O Contemplativo deixa o sentido em aberto e se interessa pelo tempo. O Cronista quer que o filme tenha uma mensagem e que ela chegue."]],w:{0:[15,1.5],9:[20,1.2],1:[35,.8],12:[30,.8],10:[68,.8],13:[35,.6],2:[40,.5]},o:-0.28},
{n:"Narrador Clássico",f:"Uma boa história, bem conduzida.",t:"Você acredita no poder de uma história bem contada. Gosta de começo, meio e fim, de personagens que querem algo e de uma emoção que se constrói com método até o momento certo. A técnica, para você, funciona melhor quando desaparece: o melhor elogio a um filme é ter esquecido que estava no cinema. Você valoriza a clareza, a ordem e o ofício, e reconhece a elegância de uma narrativa em que cada cena tem uma razão de estar ali.",c:["Acompanha melhor quando a estrutura é clara e a progressão faz sentido.", "Quer se emocionar com a história, sem se sentir afastado dela.", "Admira roteiro, atuação e condução discreta.", "Prefere finais que respondem ao que o filme prometeu."],v:[["Devoto do Intérprete", "Os dois gostam de história clássica e de emoção. O Intérprete olha para o ator e para o rosto; o Narrador olha para a construção da narrativa inteira."], ["Devoto dos Gêneros", "O Devoto dos Gêneros gosta das convenções por elas mesmas; o Narrador usa a convenção a serviço de uma história e de um personagem."]],w:{3:[15,1.5],2:[22,1],5:[25,1],1:[30,.8],12:[40,.6],13:[25,1]},o:-1.23},
{n:"Entusiasta do Espetáculo",f:"O cinema é uma festa coletiva.",t:"Você ama o cinema como experiência compartilhada: a sala cheia, a risada que contagia, o susto, o aplauso depois de uma grande cena. Sabe que um filme de estúdio é feito por centenas de mãos e se encanta com isso: o elenco que funciona em conjunto, o ritmo que não deixa cair, a escala que só o cinema tem. Para você, prazer não é defeito. Um bom filme é aquele que entrega o que promete com energia e generosidade.",c:["Gosta de ritmo, escala e de ver o investimento na tela.", "Valoriza o trabalho do conjunto mais do que a assinatura de uma pessoa.", "Vê a sala de cinema como encontro, não como retiro.", "Defende o prazer popular sem pedir desculpas."],v:[["Devoto dos Gêneros", "O Devoto dos Gêneros se interessa pelas regras e pela tradição de cada gênero. O Entusiasta se interessa pela experiência: a escala, o ritmo, o efeito na sala."], ["Narrador Clássico", "O Narrador quer uma história bem construída e discreta. O Entusiasta quer o impacto, e aceita um enredo simples se a sessão for um evento."]],w:{6:[82,1],7:[78,1],8:[85,1.2],4:[78,1],5:[30,.6],12:[65,.5]},o:0.18},
{n:"Arqueólogo do Cânone",f:"Cada filme conversa com a história do cinema.",t:"Para você, ver cinema é entrar em uma conversa que começou há mais de cem anos. Gosta de saber de onde vem uma ideia, quem a inventou e quem a levou adiante. Os grandes diretores, as obras fundadoras e as retrospectivas dão a sensação de percorrer um mapa, e cada filme novo ganha sentido quando você o encaixa nele. Você tem paciência para o clássico difícil e respeito pelas obras que moldaram a linguagem: conhece o passado para ver melhor o presente.",c:["Segue diretores e movimentos, e gosta de assistir em ciclos ou em ordem.", "Valoriza a assinatura de quem dirige e a ambição formal.", "Sente prazer em reconhecer citações, influências e heranças.", "Prefere a sala e a cópia restaurada à exibição apressada."],v:[["Explorador das Margens", "Os dois procuram cinema exigente. O Arqueólogo vai ao centro da tradição consagrada; o Explorador vai às bordas, onde estão as vozes que a história oficial deixou de fora."], ["Espectador Formalista", "O Formalista se encanta com a forma em si. O Arqueólogo se encanta com a forma situada: o que aquela imagem herda e o que ela transforma."]],w:{10:[12,1.5],11:[22,1],6:[28,1],8:[30,.8],3:[35,.6],7:[30,.5]},o:0.31},
{n:"Explorador das Margens",f:"O cinema se renova nas bordas.",t:"Você procura o cinema onde ele é menos visto: filmes de países pouco exibidos, diretores fora do circuito, vozes que o mercado ignora. Gosta de se perder em uma cinematografia nova, de ouvir uma língua e um jeito de filmar que não conhecia. Para você, a vitalidade do cinema está na diversidade de quem filma e de como filma. A curiosidade é o seu método, e cada descoberta amplia o que o cinema pode ser.",c:["Caça festivais, mostras e cinematografias pouco conhecidas.", "Dá valor a diretores com assinatura e à liberdade formal.", "Interessa-se por quem fica fora do centro: regiões, povos e gêneros.", "Aceita filmes difíceis em troca de uma descoberta."],v:[["Cinéfilo Político-Autoral", "Os dois gostam de autoria e de vozes marginais. O Político-Autoral escolhe pela posição do filme diante do mundo; o Explorador escolhe pela novidade e pela diferença, mesmo quando não há uma causa declarada."], ["Arqueólogo do Cânone", "O Arqueólogo conhece a fundo a tradição consagrada. O Explorador quer o que a tradição ainda não incorporou."]],w:{10:[88,1.5],7:[28,.8],9:[32,.8],8:[38,.5],6:[32,.6]},o:0.43},
{n:"Devoto dos Gêneros",f:"A convenção é uma linguagem compartilhada.",t:"Você ama o cinema de gênero porque o conhece por dentro: sabe o que o western promete, o que o terror cobra e como um bom policial se organiza. O prazer, para você, está na convenção bem executada e nas pequenas variações que a renovam. Aprecia o filme de estúdio de ofício e se diverte com a conversa entre títulos do mesmo gênero. Gosta de começos que apresentam as regras, de finais que as cumprem e de quem sabe brincar com elas.",c:["Reconhece e aprecia as regras do gênero, do primeiro plano ao final.", "Prefere histórias claras, com tom e promessa definidos.", "Gosta de acompanhar sagas, ciclos e tradições.", "Vê no gênero uma linguagem, não uma limitação."],v:[["Entusiasta do Espetáculo", "O Entusiasta procura o evento e a escala. O Devoto procura a forma e a tradição do gênero, e pode adorar um filme pequeno que cumpre o código à perfeição."], ["Narrador Clássico", "O Narrador quer uma boa história de qualquer tipo. O Devoto quer a boa história dentro de uma fôrma que ele reconhece."]],w:{7:[88,1.5],8:[72,1],3:[30,.8],2:[28,.8],6:[62,.7],1:[35,.5]},o:-2.53},
{n:"Cinéfilo Político-Autoral",f:"O olhar de quem dirige também é uma posição.",t:"Você procura filmes em que a forma e o mundo se encontram. Admira quem filma com voz própria e tem algo a dizer sobre o lugar em que vive: a desigualdade, a memória, o poder, quem aparece e quem fica fora do quadro. Um filme político, para você, não é um panfleto: é uma visão que se faz imagem, com risco e com estilo. Você presta atenção em quem dirige, em quem filma desde as margens e nas escolhas que transformam uma causa em cinema.",c:["Pergunta quem filma, de onde filma e a favor de quê.", "Valoriza diretores com assinatura e compromisso com o seu tempo.", "Dá atenção a vozes periféricas, regionais e historicamente silenciadas.", "Quer que a forma carregue a ideia, e não apenas a ilustre."],v:[["Explorador das Margens", "Os dois valorizam autoria e vozes de fora do centro. O Explorador escolhe pela descoberta e pela diferença; o Político-Autoral escolhe pelo que o filme defende e pelo risco que assume ao dizê-lo."], ["Cronista do Real", "O Cronista prefere o registro direto e uma forma discreta. O Político-Autoral busca uma direção forte, em que a posição política passa pela linguagem do filme."]],w:{9:[15,1.5],6:[22,1.2],10:[70,0.8],13:[68,0.6],8:[32,0.5]},o:1.46},
{n:"Devoto do Intérprete",f:"O filme começa em um rosto.",t:"Para você, o cinema acontece nas pessoas: um olhar que dura um segundo a mais, uma voz que falha, um corpo que carrega a cena inteira. Você se emociona com atores e atrizes, lembra de desempenhos antes de lembrar de planos e escolhe filmes pelo elenco e pelo texto. Acredita que a melhor técnica é a que se coloca a serviço de quem está diante da câmera. Quando o roteiro dá a um intérprete a chance de brilhar, você sente que viu algo raro.",c:["Lembra de atuações com a mesma precisão com que lembra de cenas.", "Escolhe filmes pelo elenco, pelo diálogo e pelo texto.", "Prefere a emoção que nasce de pessoas críveis.", "Valoriza uma direção discreta, que dá espaço ao ator."],v:[["Narrador Clássico", "O Narrador valoriza a arquitetura da história inteira. O Intérprete valoriza o momento humano: a cena em que o ator transforma o roteiro em vida."], ["Cronista do Real", "O Cronista quer que o filme olhe para o mundo e tome posição. O Intérprete quer que o filme olhe para uma pessoa e a torne inesquecível."]],w:{12:[12,1.5],5:[22,1],13:[22,1],0:[38,.6],1:[30,.8],3:[32,.5]},o:-0.42},
{n:"Intérprete do Mundo",f:"O cinema como leitura da sociedade.",t:"Você assiste a um filme como quem lê uma época. Cada história lhe parece um retrato do lugar e do tempo em que nasceu: as relações culturais, as transformações históricas, os comportamentos coletivos e as contradições sociais que atravessam a trama, muitas vezes sem que ela as declare. Você sai da sala com uma hipótese sobre o mundo, compara filmes de países e décadas diferentes e repara no que um enredo revela sem querer. Para você, o cinema é uma das melhores lentes para compreender as pessoas em grupo, e cada filme acrescenta uma peça a essa leitura.",c:["Lê filmes como documentos do seu tempo, inclusive os de ficção e os de entretenimento.", "Presta atenção em classe, cultura, instituições e mudanças históricas.", "Compara obras de épocas e países diferentes para ver o que muda e o que permanece.", "Prefere entender antes de se entregar: primeiro a análise, depois o abalo."],v:[["Cronista do Real", "O Cronista quer que o filme registre o real e tome posição. O Intérprete do Mundo usa o filme, mesmo o mais fantasioso, como material para ler a sociedade, e raramente precisa de uma causa declarada."], ["Cinéfilo Político-Autoral", "O Político-Autoral pergunta quem dirige e que posição a obra assume. O Intérprete do Mundo pergunta o que a obra revela sobre o seu tempo, seja quem for que a tenha feito."]],w:{1:[66,1.1],5:[74,1.5],9:[26,1],12:[68,1.1],0:[38,0.6],10:[60,0.6],3:[38,0.5]},o:-2.74},
{n:"Imaginativo",f:"O cinema como expansão da realidade.",t:"Você vai ao cinema para ver o que a vida cotidiana não oferece. Encontra prazer em universos inventivos, em situações extraordinárias, em imagens oníricas e em possibilidades que ultrapassam a experiência comum. Para você, a imaginação é uma força criativa, e o cinema é o lugar em que ela fica livre de limites: cidades que flutuam, tempos que se dobram, sonhos que viram cena. Um bom filme é o que lhe mostra algo que você ainda não tinha imaginado e ensina você a imaginar mais.",c:["Prefere mundos inventados a retratos do cotidiano.", "Aceita a lógica do sonho, do mito e do impossível sem exigir explicação.", "Valoriza cenários, figurinos e criaturas pensados para surpreender.", "Procura no cinema liberdade de invenção, mais do que mensagem."],v:[["Espectador Formalista", "O Formalista admira a construção da imagem como linguagem e como ideia. O Imaginativo admira o que essa imagem inventa: o mundo, a criatura, o impossível."], ["Entusiasta do Espetáculo", "O Entusiasta procura escala, ritmo e experiência coletiva. O Imaginativo procura invenção, e pode preferir um filme estranho e solitário a um grande evento."]],w:{0:[85,1.5],9:[75,1],5:[30,1],2:[66,0.8],3:[62,0.8],1:[42,0.7]},o:-0.86},
{n:"Espectador Sensorial",f:"O cinema como experiência dos sentidos.",t:"Para você, um filme se vive antes de se entender. Valoriza a experiência audiovisual em sua totalidade: as imagens, os sons, as texturas, as cores, os movimentos e as atmosferas que se instalam no corpo. A cena que mais ficou em você costuma ser feita de luz, de som ou de silêncio, e não de enredo. Para você, o cinema alcança diretamente a percepção, onde a compreensão narrativa não chega, e por isso procura a sala escura, o bom som e a atenção inteira.",c:["Lembra de texturas, cores e sons com mais nitidez do que da trama.", "Aceita narrativas pouco lineares quando a experiência é intensa.", "Prefere ver na sala, com o melhor som e a imagem mais fiel.", "Sente o filme no corpo antes de explicá-lo."],v:[["Contemplativo da Sala Escura", "O Contemplativo se entrega ao tempo e à presença do real. O Sensorial se entrega à textura, à cor e ao som, mesmo em filmes de forma muito construída."], ["Espectador Formalista", "O Formalista analisa como as imagens foram decididas. O Sensorial deixa de analisar e se deixa atravessar por elas."]],w:{3:[78,1.5],11:[22,1.2],5:[25,1],13:[74,0.8],2:[65,0.7],1:[40,0.6]},o:0.05},
